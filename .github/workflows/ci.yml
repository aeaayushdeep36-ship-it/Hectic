name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm run eval:gate
      - run: npm run eval:live
      - run: npm run demo:rehearse
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run a11y:lighthouse
      - run: npm run db:reset
      - run: npm run test:e2e
